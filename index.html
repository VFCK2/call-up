<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3b5c">
<title>Call-up</title>
<style>
:root{
  --navy:#0d3b5c; --blue:#1674d1; --green:#22a447; --gray:#7f8b98;
  --bg:#eef3f7; --card:#fff; --text:#14212b; --muted:#6d7882; --danger:#e94a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
button{font:inherit;border:0}
.app{max-width:600px;margin:auto;min-height:100vh;background:var(--bg)}
.header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:5}
.header-row{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px}
.title{font-size:20px;font-weight:800;line-height:1.15}.sub{font-size:12px;opacity:.8;margin-top:3px}
.back{font-size:15px;color:#fff;background:transparent;padding:8px 4px}
.page{padding:14px 12px 30px}
.update{text-align:center;color:#52606b;font-size:13px;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 8px rgba(20,45,65,.08)}
.dept{padding:14px;min-height:104px;height:104px;text-align:left;cursor:pointer;display:block;width:100%;-webkit-appearance:none;appearance:none}
.dept:active,.member:active,.primary:active,.attendance:active{transform:scale(.985)}
.dept-head{display:flex;justify-content:space-between;align-items:center}
.dept-name{font-size:20px;font-weight:800}.arrow{font-size:24px;color:#53616d}
.count{font-size:14px;margin-top:4px}.count b{font-size:22px}
.bar{height:8px;background:#dce3e8;border-radius:99px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.mid i{background:#f0a11b}.bar.low i{background:#ef5b5b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:13px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:21px;font-weight:800;margin-top:3px}
.primary{width:100%;background:var(--blue);color:#fff;border-radius:12px;padding:14px;font-weight:800;margin-top:12px;cursor:pointer;display:block;-webkit-appearance:none;appearance:none}
.section-title{font-weight:800;font-size:18px;margin:4px 0 10px}
.member{background:#fff;border-radius:13px;padding:10px;display:flex;align-items:center;gap:9px;margin-bottom:6px;box-shadow:0 2px 7px rgba(20,45,65,.06)}
.all-list .name{font-size:14px}
.all-list .time{font-size:11px;margin-top:1px}
.avatar{width:24px;height:24px;display:grid;place-items:center;color:transparent;font-weight:900;flex:none;font-size:18px}
.avatar.ok{background:transparent;color:var(--green)}
.all-list .avatar{width:22px;height:22px}
.role-badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:800;vertical-align:2px;background:#eef1f4;color:#64717c}
.role-leader{color:#b42318}.role-leader .role-badge{background:#fde2df;color:#b42318}.member.role-leader{background:#fff1ef}
.role-commander{color:#7a4e00}.role-commander .role-badge{background:#fff0c7;color:#7a4e00}.member.role-commander{background:#fff9e8}
.role-section{color:#0b6b83}.role-section .role-badge{background:#cfeff5;color:#0b6b83}.member.role-section{background:#eaf8fb}
.role-team{color:#087443}.role-team .role-badge{background:#dcf7e8;color:#087443}.member.role-team{background:#f0fbf5}
.role-member{color:var(--text)}.role-member .role-badge{background:#eef1f4;color:#64717c}.member.role-member{background:#fff}
.history-person.role-leader{background:#fff1ef;padding:8px;border-radius:8px;border-top:0;margin-top:4px}.history-person.role-commander{background:#fff9e8;padding:8px;border-radius:8px;border-top:0;margin-top:4px}.history-person.role-section{background:#eaf8fb;padding:8px;border-radius:8px;border-top:0;margin-top:4px}.history-person.role-team{background:#f0fbf5;padding:8px;border-radius:8px;border-top:0;margin-top:4px}.history-person.role-member{background:#fff;padding:8px;border-radius:8px;border-top:0;margin-top:4px}
.history-person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #edf0f2;font-size:13px}
.history-name{font-weight:800}.history-time{color:var(--muted);white-space:nowrap}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.history-title{font-weight:800}.history-count{font-size:12px;color:var(--muted);margin-top:4px}

.member-main{flex:1;min-width:0}.name{font-weight:800;font-size:16px}.time{font-size:13px;color:var(--muted);margin-top:2px}
.time.ok{color:var(--green);font-weight:700}
.attendance{min-width:74px;padding:10px 9px;border-radius:9px;background:#8b98a6;color:#fff;font-weight:800;cursor:pointer}
.attendance.ok{background:var(--green)}
.tabs{display:flex;background:#dfe7ed;padding:3px;border-radius:11px;margin-bottom:12px}
.tab{flex:1;padding:9px 4px;border-radius:8px;background:transparent;color:#50606d;font-size:13px;font-weight:700}.tab.active{background:var(--navy);color:#fff}
.dept-row{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#fff;border-radius:12px;margin-bottom:8px}
.dots{display:flex;gap:4px}.dot{width:12px;height:12px;border-radius:50%;background:#d8e0e6}.dot.ok{background:var(--green)}.dot.mid{background:#ef9b12}
.member-manage-list{display:flex;flex-direction:column;gap:6px}.manage-row{background:#fff;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 7px rgba(20,45,65,.06)}.manage-main{flex:1;min-width:0}.manage-name{font-size:15px;font-weight:800}.manage-meta{font-size:11px;color:var(--muted);margin-top:2px}.edit-btn{background:#e8eef3;color:#2d4658;border-radius:9px;padding:9px 13px;font-weight:800;white-space:nowrap}.manage-row.inactive{opacity:.55}.menu{padding:0}.menu-item{display:flex;align-items:center;gap:12px;padding:15px;background:#fff;border-bottom:1px solid #edf0f2;cursor:pointer}.menu-item:first-child{border-radius:12px 12px 0 0}.menu-item:last-child{border-radius:0 0 12px 12px}.menu-icon{font-size:22px;color:var(--blue)}.menu-main{font-weight:800}
.danger{background:#ffd9d9;color:#d93434;font-weight:800;border-radius:12px;padding:14px;width:100%;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17222b;color:#fff;border-radius:12px;padding:12px 16px;z-index:20;box-shadow:0 5px 20px rgba(0,0,0,.22);font-size:13px;display:none;max-width:90%;text-align:center}
.auth{min-height:100vh;background:linear-gradient(180deg,var(--navy),#edf3f7 55%);padding:60px 20px}
.auth-box{max-width:430px;margin:auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.auth-logo{width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 15px}
.auth h1{text-align:center;font-size:21px;margin:0}.auth p{text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
input{width:100%;border:1px solid #ccd5dc;border-radius:10px;padding:13px;font-size:18px;outline:none;margin-top:8px;text-align:center;letter-spacing:3px}
.form-label{display:block;font-size:13px;font-weight:800;margin-top:12px;color:#52606b}.form-select,.form-input{width:100%;border:1px solid #ccd5dc;border-radius:10px;padding:13px;font-size:16px;outline:none;margin-top:6px;background:#fff}.form-input{text-align:left;letter-spacing:0}
.small{font-size:11px;color:#78848e;margin-top:10px;text-align:center}
.hidden{display:none!important}.busy{opacity:.55;pointer-events:none}.loading{position:fixed;inset:0;background:rgba(255,255,255,.35);z-index:50;display:none;align-items:center;justify-content:center}.loading.show{display:flex}.loading span{background:#17222b;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px}
@media(min-width:601px){body{background:#dfe6eb}.app{box-shadow:0 0 30px rgba(0,0,0,.1)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div><div id="loading" class="loading"><span>更新中…</span></div>

<script>
const state = {
  page:"home", dept:null, filter:"all", editMemberId:null,
  members:[], adminMembers:[], attendance:{}, attendanceVersion:1, authorized:false, history:[], initializing:false
};
const localKey="saigai_device_token_v1";

// GitHub Pagesから呼び出すGAS WebアプリURL
// GASをデプロイしたら、このURLだけ差し替えてください。
const GAS_URL = "https://script.google.com/macros/s/AKfycbzkj_EMfb3Ao0H1ltcgGdPYuZySbPDa6217vK8AQJz2t558iQIsO7ysDjQNAfNln5DD/exec";

function gas(name,...args){
  return new Promise((resolve,reject)=>{
    if(!GAS_URL || GAS_URL.includes("ここにGAS")){
      reject(new Error("GAS_URLを設定してください")); return;
    }
    const callback = "gasCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const params = new URLSearchParams({
      action:name, args:JSON.stringify(args), callback:callback
    });
    window[callback] = (result)=>{ cleanup(); resolve(result); };
    script.onerror = ()=>{ cleanup(); reject(new Error("GASとの通信に失敗しました")); };
    function cleanup(){ delete window[callback]; script.remove(); }
    script.src = GAS_URL + "?" + params.toString();
    document.body.appendChild(script);
  });
}
function busy(on){document.getElementById("loading")?.classList.toggle("show",!!on)}
let toastTimer=0;
function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display="none",1800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nowText(){return new Date().toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}

async function boot(){
  const token=localStorage.getItem(localKey);
  if(!token){renderAuth();return}
  // 起動時の通信を1回にまとめ、先に画面を出す。
  state.authorized=true;
  state.initializing=true;
  render();
  try{
    await load();
    state.initializing=false;
    render();
  }catch(e){
    state.initializing=false;
    state.authorized=false;
    renderAuth();
  }
}
async function register(){
  const code=document.getElementById("regCode").value.trim();
  if(!code){toast("登録コードを入力してください");return}
  try{
    const r=await gas("registerDevice",code,navigator.userAgent.slice(0,100));
    if(!r.ok){toast(r.message||"登録できませんでした");return}
    localStorage.setItem(localKey,r.token); state.authorized=true;
    toast("この端末を登録しました");
    await load(); render();
  }catch(e){toast("通信エラー: "+e.message)}
}
function renderAuth(){
  document.getElementById("root").innerHTML=`
  <div class="auth"><div class="auth-box">
    <div class="auth-logo">消</div>
    <h1>災害時参集状況</h1>
    <p>初回のみ端末登録を行います。<br>登録後はログイン不要で利用できます。</p>
    <input id="regCode" inputmode="numeric" maxlength="12" placeholder="登録コード">
    <button class="primary" onclick="register()">この端末を登録する</button>
    <div class="small">※登録コードは団内で管理してください。</div>
  </div></div>`;
}
async function load(){
  const r=await gas("getData",localStorage.getItem(localKey));
  if(!r.ok) throw new Error(r.message||"データ取得失敗");
  state.members=r.members; state.attendance=r.attendance; state.attendanceVersion=Number(r.attendanceVersion)||1;
}
function deptMembers(d){return state.members.filter(x=>String(x.dept)===String(d))}
function countDept(d){return deptMembers(d).filter(x=>state.attendance[x.id]).length}
function total(){
 const valid=new Set(state.members.map(m=>String(m.id)));
 return Object.keys(state.attendance).filter(id=>valid.has(String(id))).length;
}
function barClass(n,max){let p=max? n/max:0;return p>=.7?"":p>=.4?"mid":"low"}

function header(title,back=true){
 return `<div class="header"><div class="header-row">
 ${back?`<button class="back" onclick="goHome()">‹ 戻る</button>`:"<div class='logo'>消</div>"}
 <div class="title">${esc(title)}${!back?`<div class="sub">災害時参集状況</div>`:""}</div>
 ${!back?`<button class="back" style="margin-left:auto" onclick="state.page='admin';render()">⚙</button>`:""}
 </div></div>`;
}
function render(){
 const root=document.getElementById("root");
 if(state.page==="home") root.innerHTML=renderHome();
 if(state.page==="dept") root.innerHTML=renderDept();
 if(state.page==="all") root.innerHTML=renderAll();
 if(state.page==="status") root.innerHTML=renderStatus();
 if(state.page==="admin") root.innerHTML=renderAdmin();
 if(state.page==="memberManage") root.innerHTML=renderMemberManage();
 if(state.page==="editMember") root.innerHTML=renderMemberForm();
 if(state.page==="history") root.innerHTML=renderHistory();
}
function renderHome(){
 if(state.initializing){
   return `<div class="app">${header("災害時参集状況",false)}<div class="page"><div class="card" style="padding:28px;text-align:center;color:var(--muted)">読み込み中…</div></div></div>`;
 }
 const max=[1,2,3,4,5,6].reduce((s,d)=>s+deptMembers(d).length,0)||30;
 return `<div class="app">${header("災害時参集状況",false)}<div class="page">
 <div class="update">${nowText()} 更新</div>
 <div class="grid">${[1,2,3,4,5,6].map(d=>{
   const n=countDept(d),m=deptMembers(d).length||5,p=Math.round(n/m*100);
   return `<button class="card dept" onclick="openDept(${d})"><div class="dept-head"><span class="dept-name">${d}部</span><span class="arrow">›</span></div>
   <div class="count"><b>${n}</b> / ${m}名</div><div class="bar ${barClass(n,m)}"><i style="width:${p}%"></i></div></button>`}).join("")}</div>
 <div class="stats"><div class="card stat"><div class="stat-label">現在の参集人数</div><div class="stat-value">${total()} / ${max}名</div></div>
 <div class="card stat"><div class="stat-label">最終参集</div><div class="stat-value">${lastTime()||"--:--"}</div></div></div>
 <div class="grid" style="margin-top:10px">
   <button class="card dept" onclick="openAll()"><div class="dept-head"><span class="dept-name">全団員</span><span class="arrow">›</span></div>
   <div class="count"><b>${state.members.length}</b>名</div><div class="bar"><i style="width:${state.members.length?Math.round(total()/state.members.length*100):0}%"></i></div></button>
 </div>
 </div></div>`;
}
function lastTime(){let a=Object.values(state.attendance);if(!a.length)return "";a.sort((x,y)=>new Date(y.time)-new Date(x.time));return new Date(a[0].time).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function openDept(d){state.dept=d;state.page="dept";render()}
function openAll(){state.page="all";state.filter="all";render()}
function goHome(){state.page="home";state.dept=null;render()}
function renderDept(){
 const d=state.dept, ms=deptMembers(d), n=countDept(d);
 return `<div class="app">${header(`${d}部`)}<div class="page">
 <div class="section-title">${ms.length}名中 <span style="color:var(--green)">${n}名</span> 参集 <span style="float:right">${n} / ${ms.length}名</span></div>
 <div class="bar ${barClass(n,ms.length)}" style="margin-bottom:12px"><i style="width:${ms.length?Math.round(n/ms.length*100):0}%"></i></div>
 ${ms.map(memberCard).join("")}
 </div></div>`;
}
function roleClass(role){
 const r=String(role||"");
 if(r==="団長"||r==="副団長") return "role-leader";
 if(r==="分団長"||r==="副分団長") return "role-commander";
 if(r==="部長"||r==="副部長") return "role-section";
 if(r==="班長"||r==="副班長") return "role-team";
 return "role-member";
}
function memberCard(m){
 const a=state.attendance[m.id], ok=!!a;
 const rc=roleClass(m.role);
 return `<div class="member ${rc}"><div class="avatar ${ok?"ok":""}">${ok?"✓":""}</div><div class="member-main"><div class="name">${esc(m.name)}${m.role?`<span class="role-badge">${esc(m.role)}</span>`:""}</div>
 <div class="time ${ok?"ok":""}">${ok?esc(new Date(a.time).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}))+" 参集":"未参集"}</div></div>
 <button class="attendance ${ok?"ok":""}" ${pendingAttendance.has(m.id)?"disabled":""} onclick="toggleAttendance('${esc(m.id)}')">${ok?"参集済":"参集"}</button></div>`;
}
const pendingAttendance = new Set();
function toggleAttendance(id){
 if(state.attendance[id] || pendingAttendance.has(id)) return;
 const token=localStorage.getItem(localKey);
 const optimistic=new Date().toISOString();
 pendingAttendance.add(id);
 state.attendance[id]={time:optimistic};
 render();
 // 押した瞬間に参集済へ。保存は完全に裏側で行う。
 toast(`${memberName(id)} さんを参集しました`);
 saveAttendance(id,token);
}
function memberName(id){
 const m=state.members.find(x=>String(x.id)===String(id));
 return m?m.name:"団員";
}
async function saveAttendance(id,token){
 try{
  const r=await gas("setAttendance",token,id,state.attendanceVersion);
  if(!r.ok){
   if(r.stale){
    const fresh=await gas("getData",token);
    if(fresh.ok){
      state.attendanceVersion=Number(fresh.attendanceVersion)||state.attendanceVersion;
      state.attendance=fresh.attendance||{};
    }
    pendingAttendance.delete(id);
    render();
    toast("リセット済みのため参集記録を取り消しました");
    return;
   }
   await reconcileAttendance(id,token,r.message||"記録できません");
   return;
  }
  state.attendanceVersion=Number(r.attendanceVersion)||state.attendanceVersion;
  // 成功時は画面を再描画しない。ユーザーが押した瞬間の表示をそのまま維持する。
  // サーバー側のスナップショットで、他の人の参集状態を上書きしない。
  pendingAttendance.delete(id);
 }catch(e){
  await reconcileAttendance(id,token,"通信エラー：記録を確認しています…");
 }
}
async function reconcileAttendance(id,token,errorMessage){
 try{
  const r=await gas("getData",token);
  if(r.ok && r.attendance && r.attendance[id]){
   state.attendanceVersion=Number(r.attendanceVersion)||state.attendanceVersion;
   state.attendance=Object.assign({},state.attendance,r.attendance);
   pendingAttendance.delete(id);
   render();
   return;
  }
 }catch(e){}
 // 1回の確認で取れない場合は、通信遅延の可能性があるため少し待って再確認。
 await new Promise(resolve=>setTimeout(resolve,500));
 try{
  const r=await gas("getData",token);
  if(r.ok && r.attendance && r.attendance[id]){
   state.attendanceVersion=Number(r.attendanceVersion)||state.attendanceVersion;
   state.attendance=Object.assign({},state.attendance,r.attendance);
   pendingAttendance.delete(id);
   render();
   return;
  }
 }catch(e){}
 delete state.attendance[id];
 pendingAttendance.delete(id);
 render();
 toast(errorMessage||"記録できませんでした");
}
function compareRole(a,b){
 const order={"団長":10,"副団長":20,"分団長":30,"副分団長":40,"部長":50,"副部長":60,"班長":70,"副班長":80,"団員":90,"":90};
 const ar=Object.prototype.hasOwnProperty.call(order,a.role||"")?order[a.role||""]:85;
 const br=Object.prototype.hasOwnProperty.call(order,b.role||"")?order[b.role||""]:85;
 if(ar!==br)return ar-br;
 const ad=Number(a.dept)||99,bd=Number(b.dept)||99;
 if(ad!==bd)return ad-bd;
 return String(a.name||"").localeCompare(String(b.name||""),"ja");
}
function renderAll(){
 const lists=(state.filter==="all"?state.members:state.members.filter(m=>state.filter==="ok"?state.attendance[m.id]:!state.attendance[m.id])).slice().sort(compareRole);
 return `<div class="app">${header("全団員一覧")}<div class="page">
 <div class="tabs"><button class="tab ${state.filter==="all"?"active":""}" onclick="setFilter('all')">すべて (${state.members.length})</button>
 <button class="tab ${state.filter==="ok"?"active":""}" onclick="setFilter('ok')">参集 (${total()})</button>
 <button class="tab ${state.filter==="ng"?"active":""}" onclick="setFilter('ng')">未参集 (${state.members.length-total()})</button></div>
 ${`<div class="all-list">${lists.map(m=>memberCard(m).replace(/<button[\s\S]*?<\/button>/,"")).join("")}</div>`}
 </div></div>`;
}
function setFilter(f){state.filter=f;render()}
function renderStatus(){
 return `<div class="app">${header("参集状況")}<div class="page">
 <div class="stats"><div class="card stat"><div class="stat-label">現在の参集人数</div><div class="stat-value">${total()} / ${state.members.length}名</div></div>
 <div class="card stat"><div class="stat-label">最終参集時刻</div><div class="stat-value">${lastTime()||"--:--"}</div></div></div>
 <div style="height:12px"></div>${[1,2,3,4,5,6].map(d=>{
 const ms=deptMembers(d),n=countDept(d);
 return `<div class="dept-row"><b>${d}部　${n} / ${ms.length}</b><div class="dots">${ms.map((_,i)=>`<i class="dot ${i<n?(n/ms.length>=.7?"ok":"mid"):""}"></i>`).join("")}</div><span>›</span></div>`}).join("")}
 </div></div>`;
}
function renderAdmin(){
 return `<div class="app">${header("管理メニュー")}<div class="page"><div class="card menu">
 <div class="menu-item" onclick="resetAll()"><div class="menu-icon">↻</div><div><div class="menu-main">参集状況をリセット</div></div></div>
 <div class="menu-item" onclick="load().then(render).then(()=>toast('データを更新しました'))"><div class="menu-icon">⟳</div><div><div class="menu-main">データを更新</div></div></div>
 <div class="menu-item" onclick="showHistory()"><div class="menu-icon">▤</div><div><div class="menu-main">参集履歴</div></div></div>
 <div class="menu-item" onclick="openMemberManage()"><div class="menu-icon">👤</div><div><div class="menu-main">団員管理</div></div></div>
 </div><button class="danger" onclick="resetAll()">緊急リセット（管理者用）</button>
 </div></div>`;
}
function roleOptions(selected){
 const roles=['団長','副団長','分団長','副分団長','部長','副部長','班長','副班長','団員'];
 return roles.map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>${esc(r)}</option>`).join('');
}
function renderMemberManage(){
 const lists=state.adminMembers.slice().sort(compareRole);
 return `<div class="app">${header("団員管理")}<div class="page">
 <button class="primary" style="margin-top:0;margin-bottom:12px" onclick="state.editMemberId=null;state.page='editMember';render()">＋ 団員を追加</button>
 <div class="member-manage-list">${lists.map(m=>`<div class="manage-row ${roleClass(m.role)} ${m.active===false?'inactive':''}">
   <div class="manage-main"><div class="manage-name">${esc(m.name)}${m.role?`<span class="role-badge">${esc(m.role)}</span>`:''}</div><div class="manage-meta">${m.dept}部${m.active===false?' ・ 退団':''}</div></div>
   <button class="edit-btn" onclick="openMemberEdit('${esc(m.id)}')">編集</button>
 </div>`).join('')}</div>
 </div></div>`;
}

async function openMemberManage(){
 busy(true);
 try{
  const r=await gas('getMembersAdmin',localStorage.getItem(localKey));
  if(!r.ok){toast(r.message||'団員一覧を取得できません');return}
  state.adminMembers=r.members||[]; state.page='memberManage'; render();
 }catch(e){toast('団員一覧を取得できませんでした')}finally{busy(false)}
}

function openMemberEdit(id){state.editMemberId=String(id);state.page='editMember';render()}
function renderMemberForm(){
 const m=(state.adminMembers||[]).find(x=>String(x.id)===String(state.editMemberId)) || state.members.find(x=>String(x.id)===String(state.editMemberId));
 const editing=!!m;
 const roles=['団長','副団長','分団長','副分団長','部長','副部長','班長','副班長','団員'];
 return `<div class="app">${header(editing?'団員編集':'団員追加')}<div class="page">
 <div class="card" style="padding:16px">
  <label class="form-label">部</label><select id="memberDept" class="form-select">${[1,2,3,4,5,6].map(d=>`<option value="${d}" ${(editing&&Number(m.dept)===d)?'selected':''}>${d}部</option>`).join('')}</select>
  <label class="form-label">氏名</label><input id="memberName" class="form-input" inputmode="text" maxlength="30" value="${editing?esc(m.name):''}" placeholder="氏名">
  <label class="form-label">役職</label><select id="memberRole" class="form-select">${roles.map(r=>`<option value="${esc(r)}" ${(editing&&m.role===r)?'selected':''}>${esc(r)}</option>`).join('')}</select>
  <label class="form-label">在籍</label><select id="memberActive" class="form-select"><option value="true" ${!editing||m.active!==false?'selected':''}>在籍</option><option value="false" ${editing&&m.active===false?'selected':''}>退団</option></select>
  <button class="primary" onclick="saveMemberFromUI()">${editing?'変更を保存':'団員を追加'}</button>
 </div></div></div>`;
}
async function saveMemberFromUI(){
 const id=state.editMemberId;
 const dept=document.getElementById('memberDept')?.value;
 const name=document.getElementById('memberName')?.value.trim();
 const role=document.getElementById('memberRole')?.value||'団員';
 const active=document.getElementById('memberActive')?.value!=='false';
 if(!dept){toast('部を選択してください');return}
 if(!name){toast('氏名を入力してください');return}
 busy(true);
 try{
  const action=id?'updateMember':'addMember';
  const args=id?[localStorage.getItem(localKey),id,dept,name,role,active]:[localStorage.getItem(localKey),dept,name,role];
  const r=await gas(action,...args);
  if(!r.ok){toast(r.message||'保存できませんでした');return}
  await load();
  const ar=await gas('getMembersAdmin',localStorage.getItem(localKey));
  state.adminMembers=ar.ok?(ar.members||[]):state.adminMembers;
  state.editMemberId=null; state.page='memberManage'; render(); toast(id?'団員情報を更新しました':'団員を追加しました');
 }catch(e){toast('団員情報の保存に失敗しました')}finally{busy(false)}
}

async function resetAll(){
 if(pendingAttendance.size){toast("保存中の参集があります。少し待ってからリセットしてください");return}
 if(!confirm("現在の参集状況を履歴に保存してから、全員を未参集に戻します。よろしいですか？"))return;
 busy(true);
 try{
  const r=await gas("resetAttendance",localStorage.getItem(localKey));
  if(r.ok){
   pendingAttendance.clear();
   state.attendanceVersion=Number(r.attendanceVersion)||state.attendanceVersion+1;
   state.attendance={};
   state.page="home";
   render();
   toast("履歴を保存して参集状況をリセットしました");
  }
  else toast(r.message||"リセットできませんでした");
 }catch(e){toast("リセットできませんでした")}finally{busy(false)}
}
async function showHistory(){
 busy(true);
 try{
  const r=await gas("getHistory",localStorage.getItem(localKey));
  if(!r.ok){toast(r.message||"履歴を取得できません");return}
  state.history=r.history||[]; state.page="history"; render();
 }catch(e){toast("履歴を取得できませんでした")}finally{busy(false)}
}
function compareHistoryMember(a,b){
 const order={"団長":10,"副団長":20,"分団長":30,"副分団長":40,"部長":50,"副部長":60,"班長":70,"副班長":80,"団員":90,"":90};
 const ar=Object.prototype.hasOwnProperty.call(order,a.role||"")?order[a.role||""]:85;
 const br=Object.prototype.hasOwnProperty.call(order,b.role||"")?order[b.role||""]:85;
 if(ar!==br)return ar-br;
 const ad=Number(a.dept)||99,bd=Number(b.dept)||99;
 if(ad!==bd)return ad-bd;
 return String(a.name||"").localeCompare(String(b.name||""),"ja");
}
function renderHistory(){
 return `<div class="app">${header("参集履歴")}<div class="page">${state.history.length?state.history.map((h,index)=>{
   const d=new Date(h.resetAt);
   const uniqueMembers=[]; const seen=new Set();
   (h.members||[]).forEach(m=>{const key=String(m.memberId); if(!seen.has(key)){seen.add(key);uniqueMembers.push(m);}});
   const count=uniqueMembers.length;
   return `<div class="card" style="padding:14px;margin-bottom:10px">
    <div class="history-head">
      <div><div class="history-title">第${index+1}回　${d.toLocaleString("ja-JP")}</div><div class="history-count">参集人数：${count}名</div></div>
      <button class="danger" style="width:auto;margin:0;padding:8px 11px;background:#ffe1e1" onclick="deleteHistory('${esc(h.id)}')">削除</button>
    </div>
    <div style="margin-top:10px">${uniqueMembers.slice().sort(compareHistoryMember).map(m=>{const rc=roleClass(m.role);return `<div class="history-person ${rc}"><span class="history-name">${esc(m.name||"")}${m.role?`<span class="role-badge">${esc(m.role)}</span>`:""}</span><span class="history-time">${new Date(m.assembledAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</span></div>`}).join("")}</div>
   </div>`;
 }).join(""):"<div class='card' style='padding:20px;text-align:center;color:var(--muted)'>履歴はありません</div>"}</div></div>`;
}
async function deleteHistory(id){
 if(!confirm("この参集履歴を削除します。よろしいですか？"))return;
 busy(true);
 try{
  const r=await gas("deleteHistory",localStorage.getItem(localKey),id);
  if(!r.ok){toast(r.message||"履歴を削除できません");return}
  state.history=state.history.filter(h=>String(h.id)!==String(id));
  render();
  toast("参集履歴を削除しました");
 }catch(e){toast("履歴を削除できませんでした")}finally{busy(false)}
}
boot();
</script>
</body>
</html>
